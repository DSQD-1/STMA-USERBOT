<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#08090d"
  >

  <title>STMA</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <link rel="stylesheet" href="/style.css">
</head>

<body>

<div id="app">

  <header class="topbar">
    <div>
      <div class="logo">STMA</div>
      <div class="subtitle">
        AI Business Manager
      </div>
    </div>

    <div class="status">
      <span id="statusDot"></span>
      <span id="statusText">Подключение</span>
    </div>
  </header>

  <main>

    <section id="homeScreen" class="screen active">

      <div class="connection-card">
        <div class="connection-title">
          Business Connection
        </div>

        <select id="connectionSelect">
          <option value="">
            Загрузка...
          </option>
        </select>

        <div id="connectionInfo" class="muted">
          Проверка подключения...
        </div>
      </div>

      <div class="ai-card">

        <div class="ai-title">
          <span class="ai-icon">🤖</span>
          Что сделать?
        </div>

        <textarea
          id="commandInput"
          placeholder="Например: замуть @alex на 2 часа"
          rows="4"
        ></textarea>

        <button
          id="executeButton"
          class="primary"
        >
          Выполнить
        </button>

        <div
          id="commandResult"
          class="command-result hidden"
        ></div>

      </div>

      <div class="quick-grid">

        <button
          class="stat-card"
          data-screen="editedScreen"
        >
          <span>✏️</span>
          <strong id="editedCount">0</strong>
          <small>Изменённые</small>
        </button>

        <button
          class="stat-card"
          data-screen="deletedScreen"
        >
          <span>🗑</span>
          <strong id="deletedCount">0</strong>
          <small>Удалённые</small>
        </button>

        <button
          class="stat-card"
          data-screen="watchScreen"
        >
          <span>👁</span>
          <strong id="watchCount">0</strong>
          <small>Слежение</small>
        </button>

        <button
          class="stat-card"
          data-screen="statsScreen"
        >
          <span>📊</span>
          <strong id="eventCount">0</strong>
          <small>События</small>
        </button>

      </div>

      <div class="examples">

        <div class="section-title">
          Примеры команд
        </div>

        <button
          class="example"
          data-command="замуть @username на 30 минут"
        >
          🔇 Замуть @username на 30 минут
        </button>

        <button
          class="example"
          data-command="размути @username"
        >
          🔊 Размути @username
        </button>

        <button
          class="example"
          data-command="следи за @username"
        >
          👁 Следи за @username
        </button>

        <button
          class="example"
          data-command="покажи удалённые сообщения сегодня"
        >
          🗑 Покажи удалённые сегодня
        </button>

        <button
          class="example"
          data-command="покажи изменения сегодня"
        >
          ✏️ Покажи изменения сегодня
        </button>

      </div>

    </section>

    <section
      id="editedScreen"
      class="screen"
    >

      <div class="screen-header">
        <button class="back">‹</button>
        <h2>Изменённые</h2>
      </div>

      <div id="editedList"></div>

    </section>

    <section
      id="deletedScreen"
      class="screen"
    >

      <div class="screen-header">
        <button class="back">‹</button>
        <h2>Удалённые</h2>
      </div>

      <div id="deletedList"></div>

    </section>

    <section
      id="watchScreen"
      class="screen"
    >

      <div class="screen-header">
        <button class="back">‹</button>
        <h2>Отслеживание</h2>
      </div>

      <div class="watch-add">

        <input
          id="watchInput"
          placeholder="@username"
          autocomplete="off"
        >

        <button
          id="watchAddButton"
          class="primary"
        >
          Добавить
        </button>

      </div>

      <div id="watchList"></div>

    </section>

    <section
      id="statsScreen"
      class="screen"
    >

      <div class="screen-header">
        <button class="back">‹</button>
        <h2>Статистика</h2>
      </div>

      <div
        id="statsGrid"
        class="stats-grid"
      ></div>

    </section>

  </main>

  <nav class="bottom-nav">

    <button
      class="nav-button active"
      data-screen="homeScreen"
    >
      <span>⌂</span>
      <small>Главная</small>
    </button>

    <button
      class="nav-button"
      data-screen="editedScreen"
    >
      <span>✏️</span>
      <small>Изменения</small>
    </button>

    <button
      class="nav-button"
      data-screen="deletedScreen"
    >
      <span>🗑</span>
      <small>Удалённые</small>
    </button>

    <button
      class="nav-button"
      data-screen="watchScreen"
    >
      <span>👁</span>
      <small>Слежение</small>
    </button>

    <button
      class="nav-button"
      data-screen="statsScreen"
    >
      <span>📊</span>
      <small>Статистика</small>
    </button>

  </nav>

</div>

<script src="/app.js"></script>

</body>
</html>
