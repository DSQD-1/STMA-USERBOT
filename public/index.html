<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  >

  <meta name="theme-color" content="#0b0d12">

  <title>STMA</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <link rel="stylesheet" href="/style.css">
</head>

<body>

  <!-- SPLASH -->
  <div id="splash" class="splash">

    <div class="splash-logo">
      S
    </div>

    <div class="splash-title">
      STMA
    </div>

    <div class="splash-subtitle">
      Управление Telegram
    </div>

    <div class="splash-loader">
      <span></span>
      <span></span>
      <span></span>
    </div>

  </div>


  <!-- APP -->
  <div id="app" class="hidden">

    <!-- HEADER -->
    <header class="header">

      <div class="brand">

        <div class="brand-icon">
          S
        </div>

        <div class="brand-text">

          <div class="brand-title">
            STMA
          </div>

          <div
            id="status"
            class="brand-status"
          >
            ○ Подключение...
          </div>

        </div>

      </div>

    </header>


    <!-- CONTENT -->
    <main
      id="content"
      class="content"
    ></main>


    <!-- BOTTOM NAV -->
    <nav class="bottom-nav">

      <button
        class="nav-item active"
        data-page="home"
        type="button"
      >
        <span class="nav-icon">
          ⌂
        </span>

        <small>
          Главная
        </small>
      </button>


      <button
        class="nav-item"
        data-page="watch"
        type="button"
      >
        <span class="nav-icon">
          ◉
        </span>

        <small>
          Слежка
        </small>
      </button>


      <button
        class="nav-item"
        data-page="actions"
        type="button"
      >
        <span class="nav-icon">
          ✦
        </span>

        <small>
          Действия
        </small>
      </button>


      <button
        class="nav-item"
        data-page="settings"
        type="button"
      >
        <span class="nav-icon">
          ⚙
        </span>

        <small>
          Настройки
        </small>
      </button>

    </nav>

  </div>


  <!-- TOAST -->
  <div
    id="toast"
    class="toast"
  ></div>


  <script src="/app.js"></script>

</body>
</html>
